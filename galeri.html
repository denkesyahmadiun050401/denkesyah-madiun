```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Galeri | DENKESYAH MADIUN</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================
       HEADER HALAMAN
    ========================== */
    .gallery-header {
      text-align: center;
      max-width: 850px;
      margin: 0 auto 35px;
    }

    .gallery-header h1 {
      margin-bottom: 12px;
    }

    .gallery-header p {
      color: var(--muted);
      line-height: 1.7;
    }

    /* =========================
       FILTER
    ========================== */
    .gallery-filter {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 35px;
    }

    .filter-btn {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--g);
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .filter-btn:hover {
      background: var(--g);
      color: var(--white);
      border-color: var(--g);
    }

    .filter-btn.active {
      background: var(--g);
      color: var(--white);
      border-color: var(--g);
    }

    /* =========================
       GRID GALERI
    ========================== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .gallery-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 35px rgba(0,0,0,0.10);
    }

    .gallery-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      background: #e8ece9;
    }

    .gallery-info {
      padding: 20px;
    }

    .gallery-category {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: var(--g);
      background: #edf2ee;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .gallery-info h3 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 20px;
    }

    .gallery-info p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .gallery-date {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       PESAN KOSONG
    ========================== */
    .gallery-empty {
      text-align: center;
      padding: 50px 20px;
      background: var(--cream);
      border-radius: 18px;
      color: var(--muted);
    }

    /* =========================
       LIGHTBOX
    ========================== */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.88);
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .lightbox.show {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 1100px;
      width: 100%;
      text-align: center;
    }

    .lightbox-image {
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      margin: 0 auto;
    }

    .lightbox-title {
      color: #fff;
      margin-top: 15px;
      font-size: 18px;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 25px;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.3);
    }

    /* =========================
       ERROR
    ========================== */
    .gallery-error {
      display: none;
      padding: 25px;
      border-radius: 15px;
      background: #fff3f3;
      border: 1px solid #e3bcbc;
      color: #8b2f2f;
      text-align: center;
      line-height: 1.7;
    }

    /* =========================
       RESPONSIVE
    ========================== */
    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-image {
        height: 220px;
      }

      .filter-btn {
        padding: 9px 14px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================

  <main>

    <section class="pagehead">
      <div class="wrap">

        <div class="gallery-header">

          <div class="eyebrow">

          </div>

          <h1 id="judul-galeri">

          </h1>

          <p id="deskripsi-galeri">

    <!-- =========================

      <div>

      </div>

  <!-- =========================
       JAVASCRIPT
  ========================== -->
  <script>

    /*
      =====================================================
      MEMBACA DATA GALERI
      =====================================================

      Karena website berada di:

      /denkesyah-madiun/

      maka kita menggunakan URL relatif:

      data/galeri.json

      Browser akan otomatis membacanya sebagai:

      /denkesyah-madiun/data/galeri.json
    */

    const DATA_URL = "data/galeri.json";

    let galleryData = [];
    let activeCategory = "Semua";


    /* =====================================================
       ELEMENT HTML
    ===================================================== */

    const galleryGrid =
      document.getElementById("gallery-grid");

    const galleryFilter =
      document.getElementById("gallery-filter");

    const galleryError =
      document.getElementById("gallery-error");

    const judulGaleri =
      document.getElementById("judul-galeri");

    const deskripsiGaleri =
      document.getElementById("deskripsi-galeri");

    const lightbox =
      document.getElementById("lightbox");

    const lightboxImage =
      document.getElementById("lightbox-image");

    const lightboxTitle =
      document.getElementById("lightbox-title");

    const lightboxClose =
      document.getElementById("lightbox-close");


    /* =====================================================
       LOAD DATA
    ===================================================== */

    async function loadGallery() {

      try {

        const response = await fetch(DATA_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status +
            " - file galeri.json tidak dapat dibaca."
          );
        }

        const data = await response.json();

        /*
          Memastikan struktur JSON benar
        */

        if (!data || typeof data !== "object") {
          throw new Error(
            "Format galeri.json tidak valid."
          );
        }

        /*
          Judul halaman
        */

        if (data.judul) {
          judulGaleri.textContent = data.judul;
        }

        /*
          Deskripsi halaman
        */

        if (data.deskripsi) {
          deskripsiGaleri.textContent =
            data.deskripsi;
        }

        /*
          Data foto
        */

        if (!Array.isArray(data.galeri)) {
          throw new Error(
            'Bagian "galeri" tidak ditemukan atau bukan array.'
          );
        }

        galleryData = data.galeri;

        /*
          Buat tombol kategori
        */

        createFilters(data.kategori);

        /*
          Tampilkan foto
        */

        renderGallery();

      }

      catch (error) {

        console.error(
          "ERROR GALERI:",
          error
        );

        galleryError.style.display = "block";

        galleryError.innerHTML =
          "<strong>Galeri belum dapat dimuat.</strong><br><br>" +
          "Terjadi masalah saat membaca data galeri.<br>" +
          "<small>" +
          error.message +
          "</small>";

      }

    }


    /* =====================================================
       MEMBUAT FILTER KATEGORI
    ===================================================== */

    function createFilters(categories) {

      galleryFilter.innerHTML = "";

      /*
        Jika kategori tidak tersedia,
        buat kategori otomatis dari data foto.
      */

      if (
        !Array.isArray(categories) ||
        categories.length === 0
      ) {

        categories = [
          "Semua",
          ...new Set(
            galleryData.map(
              item => item.kategori
            )
          )
        ];

      }

      categories.forEach(function(category) {

        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          "filter-btn" +
          (category === activeCategory
            ? " active"
            : "");

        button.textContent = category;

        button.addEventListener(
          "click",
          function() {

            activeCategory = category;

            document
              .querySelectorAll(".filter-btn")
              .forEach(function(btn) {
                btn.classList.remove("active");
              });

            button.classList.add("active");

            renderGallery();

          }
        );

        galleryFilter.appendChild(button);

      });

    }


    /* =====================================================
       MENAMPILKAN GALERI
    ===================================================== */

    function renderGallery() {

      galleryGrid.innerHTML = "";

      /*
        Filter berdasarkan kategori
      */

      let filteredData;

      if (activeCategory === "Semua") {

        filteredData = galleryData;

      } else {

        filteredData =
          galleryData.filter(function(item) {

            return item.kategori === activeCategory;

          });

      }


      /*
        Jika tidak ada foto
      */

      if (filteredData.length === 0) {

        galleryGrid.innerHTML = `
          <div class="gallery-empty" style="grid-column:1/-1;">
            Belum ada dokumentasi pada kategori ini.
          </div>
        `;

        return;

      }


      /*
        Buat setiap kartu foto
      */

      filteredData.forEach(function(item) {

        const card =
          document.createElement("article");

        card.className =
          "gallery-card";


        /*
          Pastikan data memiliki nilai
        */

        const image =
          item.gambar || "";

        const title =
          item.judul ||
          "Dokumentasi DENKESYAH MADIUN";

        const description =
          item.deskripsi ||
          "";

        const category =
          item.kategori ||
          "Dokumentasi";

        const date =
          item.tanggal ||
          "";


        card.innerHTML = `

          <img
            src="${image}"
            alt="${escapeHtml(title)}"
            class="gallery-image"
            loading="lazy">

          <div class="gallery-info">

            <div class="gallery-category">
              ${escapeHtml(category)}
            </div>

            <h3>
              ${escapeHtml(title)}
            </h3>

            <p>
              ${escapeHtml(description)}
            </p>

            ${
              date
              ? `<div class="gallery-date">
                   ${escapeHtml(date)}
                 </div>`
              : ""
            }

          </div>

        `;


        /*
          Klik foto → lightbox
        */

        const imageElement =
          card.querySelector(".gallery-image");

        imageElement.addEventListener(
          "click",
          function() {

            openLightbox(
              image,
              title
            );

          }
        );


        /*
          Jika gambar gagal dimuat
        */

        imageElement.addEventListener(
          "error",
          function() {

            imageElement.alt =
              "Gambar tidak ditemukan";

            imageElement.style.objectFit =
              "contain";

          }
        );


        galleryGrid.appendChild(card);

      });

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text == null
          ? ""
          : String(text);

      return div.innerHTML;

    }


    /* =====================================================
       LIGHTBOX
    ===================================================== */

    function openLightbox(
      image,
      title
    ) {

      lightboxImage.src =
        image;

      lightboxImage.alt =
        title;

      lightboxTitle.textContent =
        title;

      lightbox.classList.add("show");

      document.body.style.overflow =
        "hidden";

    }


    function closeLightbox() {

      lightbox.classList.remove(
        "show"
      );

      lightboxImage.src = "";

      document.body.style.overflow =
        "";

    }


    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );


    /*
      Klik area gelap
    */

    lightbox.addEventListener(
      "click",
      function(event) {

        if (
          event.target === lightbox
        ) {
          closeLightbox();
        }

      }
    );


    /*
      Tombol ESC
    */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape"
        ) {
          closeLightbox();
        }

      }
    );


    /* =====================================================
       JALANKAN
    ===================================================== */

    loadGallery();

  </script>

</body>
</html>
