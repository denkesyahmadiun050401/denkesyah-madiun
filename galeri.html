<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Galeri | DENKESYAH MADIUN</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="nav">
    <div class="navin wrap">

      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="Logo DENKESYAH MADIUN" class="logo-img">

        <div>
          <strong>DENKESYAH MADIUN</strong>
          <small>Detasemen Kesehatan Wilayah</small>
        </div>
      </a>

      <div class="links">
        <a href="index.html">Beranda</a>
        <a href="profil.html">Profil</a>
        <a href="layanan.html">Layanan</a>
        <a href="informasi.html">Informasi</a>
        <a href="galeri.html" class="active">Galeri</a>
        <a href="kontak.html">Kontak</a>
      </div>

    </div>
  </nav>


  <!-- HEADER -->
  <header class="pagehead">
    <div class="wrap">

      <span class="eyebrow">DOKUMENTASI</span>

      <h1 id="judul-galeri">Galeri Kegiatan</h1>

      <p id="deskripsi-galeri">
        Memuat informasi...
      </p>

    </div>
  </header>


  <!-- GALERI -->
  <section>
    <div class="wrap">

      <div id="daftar-galeri" class="gallery">
        <p>Memuat galeri...</p>
      </div>

    </div>
  </section>


  <!-- FOOTER -->
  <footer>
    <div class="foot wrap">

      <div>
        <strong>DENKESYAH MADIUN</strong>
        <p>Informasi resmi dan dokumentasi kegiatan.</p>
      </div>

      <div>
        <p>
          JL. Tanjung Manis No. 17,
          Manisrejo, Taman, Madiun
        </p>
      </div>

    </div>
  </footer>


  <script>

    fetch("data/galeri.json")
      .then(function(response) {

        if (!response.ok) {
          throw new Error("galeri.json tidak ditemukan");
        }

        return response.json();

      })

      .then(function(data) {

        document.getElementById("judul-galeri").textContent =
          data.judul || "Galeri Kegiatan";

        document.getElementById("deskripsi-galeri").textContent =
          data.deskripsi || "";

        const daftar = document.getElementById("daftar-galeri");

        daftar.innerHTML = "";

        if (!data.galeri || data.galeri.length === 0) {

          daftar.innerHTML = `
            <div class="note">
              <strong>Belum Ada Dokumentasi</strong>
              <p>
                Dokumentasi foto kegiatan akan ditampilkan
                setelah data tersedia.
              </p>
            </div>
          `;

          return;
        }

        data.galeri.forEach(function(item) {

          const div = document.createElement("div");

          div.className = "photo";

          div.innerHTML = `
            
            <img
              src="${item.gambar}"
              alt="${item.judul || 'Dokumentasi DENKESYAH MADIUN'}"
              style="width:100%; height:240px; object-fit:cover; display:block;"
            >

            <div style="padding:16px;">

              <span class="date">
                DOKUMENTASI
              </span>

              <h3>
                ${item.judul || ""}
              </h3>

              <p>
                ${item.deskripsi || ""}
              </p>

            </div>

          `;

          daftar.appendChild(div);

        });

      })

      .catch(function(error) {

        console.error(error);

        document.getElementById("daftar-galeri").innerHTML = `
          
          <div class="note">

            <strong>
              Data galeri belum dapat dimuat.
            </strong>

            <p>
              Periksa kembali file galeri.json
              dan lokasi foto.
            </p>

          </div>

        `;

      });

  </script>

</body>
</html>
