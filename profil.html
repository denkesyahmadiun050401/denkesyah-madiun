  <style>
    /* =========================
       PROFIL UTAMA
    ========================== */

    .profile-intro {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 40px;
      align-items: center;
    }

    .profile-intro-logo {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-intro-logo img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    .profile-text p {
      line-height: 1.8;
      color: var(--muted);
    }


    /* =========================
       KONTEN PROFIL
    ========================== */

    .profile-section {
      margin-bottom: 55px;
    }

    .profile-section h2 {
      margin-bottom: 15px;
    }

    .profile-section > p {
      line-height: 1.8;
      color: var(--muted);
    }


    /* =========================
       SEJARAH
    ========================== */

    .history-list {
      display: grid;
      gap: 25px;
      margin-top: 30px;
    }

    .history-item {
      position: relative;
      padding: 28px 30px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .history-number {
      display: inline-flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--g);
      color: var(--white);
      font-weight: 700;
      margin-bottom: 15px;
    }

    .history-item h3 {
      margin: 0 0 12px;
      color: var(--ink);
    }

    .history-item p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      white-space: pre-line;
    }


    /* =========================
       FASILITAS
    ========================== */

    .facility-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 25px 0;
      padding: 0;
      list-style: none;
    }

    .facility-list li {
      padding: 16px 18px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      font-weight: 600;
    }

    .facility-list li::before {
      content: "✓";
      display: inline-block;
      margin-right: 10px;
      color: var(--gold);
      font-weight: 800;
    }


    /* =========================
       TUGAS
    ========================== */

    .task-list {
      display: grid;
      gap: 14px;
      margin: 25px 0;
      padding: 0;
      list-style: none;
    }

    .task-list li {
      position: relative;
      padding: 18px 20px 18px 48px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
      line-height: 1.7;
      color: var(--ink);
    }

    .task-list li::before {
      content: "•";
      position: absolute;
      left: 22px;
      top: 13px;
      color: var(--gold);
      font-size: 28px;
      font-weight: bold;
    }


    /* =========================
       LOKASI
    ========================== */

    .location-box {
      padding: 30px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 18px;
      margin-top: 25px;
    }

    .location-box h3 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .location-address {
      line-height: 1.8;
      color: var(--ink);
    }

    .closing-text {
      margin-top: 25px;
      color: var(--muted);
      line-height: 1.8;
    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 800px) {

      .profile-intro {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 20px;
      }

      .profile-intro-logo img {
        width: 120px;
        height: 120px;
      }

      .facility-list {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>
